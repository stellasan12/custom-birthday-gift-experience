<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E6FF"/>
      <stop offset="50%" stop-color="#FFE8F0"/>
      <stop offset="100%" stop-color="#FFFDE8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>

  <!-- Balloon 1 (pink) -->
  <line x1="250" y1="300" x2="250" y2="420" stroke="#D4A0C0" stroke-width="2"/>
  <ellipse cx="250" cy="260" rx="35" ry="45" fill="#FFB5C5" opacity="0.7"/>
  <ellipse cx="245" cy="248" rx="10" ry="15" fill="white" opacity="0.3"/>
  <polygon points="250,305 244,312 256,312" fill="#FFB5C5" opacity="0.7"/>

  <!-- Balloon 2 (lavender) -->
  <line x1="400" y1="250" x2="400" y2="390" stroke="#B0A0D0" stroke-width="2"/>
  <ellipse cx="400" cy="210" rx="38" ry="48" fill="#D8B4FE" opacity="0.7"/>
  <ellipse cx="394" cy="196" rx="11" ry="16" fill="white" opacity="0.3"/>
  <polygon points="400,258 394,265 406,265" fill="#D8B4FE" opacity="0.7"/>

  <!-- Balloon 3 (yellow) -->
  <line x1="550" y1="280" x2="550" y2="410" stroke="#D0C090" stroke-width="2"/>
  <ellipse cx="550" cy="240" rx="35" ry="45" fill="#FFE5A0" opacity="0.7"/>
  <ellipse cx="545" cy="228" rx="10" ry="15" fill="white" opacity="0.3"/>
