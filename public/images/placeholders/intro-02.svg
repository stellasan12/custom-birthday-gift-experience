  <!-- Sparkles -->
  <polygon points="150,150 153,140 156,150 153,160" fill="#FFE5A0" opacity="0.5"/>
  <polygon points="650,200 652,194 654,200 652,206" fill="#E8C5F0" opacity="0.4"/>
  <polygon points="300,500 302,494 304,500 302,506" fill="#FFB5C5" opacity="0.4"/>
  <polygon points="500,130 502,124 504,130 502,136" fill="#B5D8F7" opacity="0.4"/>

  <!-- Heart shape -->
  <path d="M680,160 C665,145 645,165 660,185 L680,205 L700,185 C715,165 695,145 680,160Z" fill="#FFB5C5" opacity="0.35"/>

  <!-- Decorative dots -->
