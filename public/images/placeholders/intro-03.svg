<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE8"/>
      <stop offset="50%" stop-color="#FFE8F0"/>
      <stop offset="100%" stop-color="#FFF5F5"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD1DC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD1DC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>

  <!-- Central glow -->
  <circle cx="400" cy="280" r="150" fill="url(#glow3)"/>

  <!-- Gift box body -->
  <rect x="340" y="280" width="120" height="80" rx="8" fill="#FFB5C5" opacity="0.8"/>
  <!-- Gift box lid -->
  <rect x="330" y="265" width="140" height="25" rx="6" fill="#FFD1DC" opacity="0.9"/>
  <!-- Ribbon vertical -->
  <rect x="392" y="265" width="16" height="95" fill="#E8C5F0" opacity="0.7"/>
  <!-- Ribbon horizontal -->
  <rect x="330" y="300" width="140" height="16" fill="#E8C5F0" opacity="0.7"/>
  <!-- Bow left -->
  <ellipse cx="385" cy="258" rx="20" ry="12" fill="#D8B4FE" opacity="0.8" transform="rotate(-20 385 258)"/>
  <!-- Bow right -->
  <ellipse cx="415" cy="258" rx="20" ry="12" fill="#D8B4FE" opacity="0.8" transform="rotate(20 415 258)"/>
  <!-- Bow center -->
  <circle cx="400" cy="262" r="6" fill="#C084FC"/>

  <!-- Sparkles around gift -->
  <polygon points="300,230 303,220 306,230 303,240" fill="#FFE5A0" opacity="0.6"/>
  <polygon points="510,240 513,230 516,240 513,250" fill="#E8C5F0" opacity="0.5"/>
  <polygon points="330,410 333,404 336,410 333,416" fill="#B5D8F7" opacity="0.5"/>
  <polygon points="490,390 493,384 496,390 493,396" fill="#FFE5A0" opacity="0.5"/>
  <polygon points="280,320 282,315 284,320 282,325" fill="#FFB5C5" opacity="0.4"/>
  <polygon points="520,310 522,305 524,310 522,315" fill="#A8E6CF" opacity="0.4"/>

  <!-- Hearts floating -->
  <path d="M220,170 C205,155 185,175 200,195 L220,215 L240,195 C255,175 235,155 220,170Z" fill="#FFB5C5" opacity="0.3" transform="scale(0.6) translate(120 80)"/>
  <path d="M600,140 C585,125 565,145 580,165 L600,185 L620,165 C635,145 615,125 600,140Z" fill="#D8B4FE" opacity="0.25" transform="scale(0.5) translate(400 40)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="450" r="25" fill="#FFE5A0" opacity="0.15"/>
  <circle cx="650" cy="480" r="20" fill="#E8C5F0" opacity="0.15"/>
  <circle cx="700" cy="150" r="30" fill="#B5D8F7" opacity="0.12"/>

  <!-- Center text -->
  <text x="400" y="440" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#C9A0B8" opacity="0.75">Are you ready?</text>
</svg>
